# ===================================================================
# LLM GEMM/BMM/elementwise_ops 算子尺度配置 (MNK)
# 数据来源: LLM矩阵运算统计.xlsx (Prefill.csv, Decode.csv)
# 包含MODEL：
# Qwen3_30B_A3B, Qwen3_235B_A22B, Qwen3_0_6B, Qwen3_1_7B, Qwen3_4B, Qwen3_8B, Qwen3_14B, Qwen3_32B, 
# DeepSeek_V3, DeepSeek_V3_0324, DeepSeek_V3_1, 
# Meta_Llama_3_8B, Meta_Llama_3_70B, Meta_Llama_3_1_8B,
# Meta_Llama_2_7B, Meta_Llama_2_13B, Meta_Llama_2_70B
# - Prefill: M=4096 (seq_len)
# - Decode:  M=1
# - BMM(qk/pv): batch_size = num_heads; qk的{m=seq_len,k=head_dim,n=seq_len}；
#               pv的{m=seq_len,k=seq_len,n=head_dim}；Decode 时 seq_len=4096。
# - elementwise_ops:
#   - rms_norm: size = hidden_size
#   - ffn_activation(silu): size = intermediate_size
#   - attention_softmax: size = num_heads * seq_len (Prefill) 或 num_heads * 4096 (Decode)
# ===================================================================

models:

  Qwen3_30B_A3B:
    hidden_size: 2048
    intermediate_size: 6144
    num_heads: 32
    num_kv_heads: 4
    head_dim: 128

    Prefill:
      gemm_ops:
        up_proj:   { m: 4096, k: 2048, n: 6144 }
        down_proj: { m: 4096, k: 6144, n: 2048 }
        q_proj:    { m: 4096, k: 2048, n: 4096 }
        kv_proj:   { m: 4096, k: 2048, n: 512 }
        o_proj:    { m: 4096, k: 4096, n: 2048 }
      bmm_ops:
        qk: { batch_size: 32, m: 4096, k: 128, n: 4096 }
        pv: { batch_size: 32, m: 4096, k: 4096, n: 128 }
      elementwise_ops:
        pre_attention_norm_rms: { size: 2048 }
        pre_ffn_norm_rms:       { size: 2048 }
        ffn_activation_silu:    { size: 6144 }
        attention_softmax:      { size: 32 * 4096 }

    Decode:
      gemm_ops:
        up_proj:   { m: 1, k: 2048, n: 6144 }
        down_proj: { m: 1, k: 6144, n: 2048 }
        q_proj:    { m: 1, k: 2048, n: 4096 }
        kv_proj:   { m: 1, k: 2048, n: 512 }
        o_proj:    { m: 1, k: 4096, n: 2048 }
      bmm_ops:
        qk: { batch_size: 32, m: 1, k: 128, n: 4096 }
        pv: { batch_size: 32, m: 1, k: 4096, n: 128 }
      elementwise_ops:
        pre_attention_norm_rms: { size: 2048 }
        pre_ffn_norm_rms:       { size: 2048 }
        ffn_activation_silu:    { size: 6144 }
        attention_softmax:      { size: 32 * 4096 }

